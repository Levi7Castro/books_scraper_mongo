[project]
name = "books-scraper-mongo"
version = "0.1.0"
description = "Scraper de books.toscrape.com com carga no MongoDB orquestrada pelo Airflow"
readme = "README.md"
authors = [
    { name = "Levi7Castro", email = "marcoslevi2014.mll@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pymongo>=4.20.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mongomock",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
